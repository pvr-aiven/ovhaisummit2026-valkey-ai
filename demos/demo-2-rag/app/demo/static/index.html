<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo 2 · Assistant RAG · Valkey</title>
<style>
  :root{
    --bg:#f5f6fb; --panel:#fff; --ink:#0b1033; --muted:#5a5f73; --brand:#000e9d; --brand2:#4a5bff;
    --ok:#0a8f4e; --ko:#c4321b; --line:#e3e6f3; --code:#0b1033; --codeink:#d7dcff; --accent:#ff8a3d;
  }
  *{box-sizing:border-box}
  body{margin:0;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--brand);color:#fff;flex-wrap:wrap}
  header h1{font-size:20px;margin:0 8px 0 0}
  .pill{font-size:13px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .pill.warn{background:#ffb37a;color:#0b1033}
  .spacer{flex:1}
  main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:18px 24px;height:calc(100vh - 58px)}
  .col{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .col h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .col h2 .r{margin-left:auto;font-size:13px;text-transform:none;letter-spacing:0}
  #chat{flex:1;overflow:auto;padding:16px 18px}
  .msg{margin:0 0 16px;max-width:92%}
  .msg.user{margin-left:auto;background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;width:fit-content}
  .msg.assistant{background:#f3f5ff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 16px}
  .msg.assistant.norag{background:#fff7ef;border-color:#ffd9b8}
  .msg .tagline{font-size:12px;color:var(--muted);margin-bottom:6px}
  .msg p{margin:.3em 0}.msg ul,.msg ol{margin:.3em 0;padding-left:1.3em}
  .msg code{background:#e6e9fb;border-radius:5px;padding:1px 5px;font:14px ui-monospace,Menlo,monospace}
  .msg pre{background:var(--code);color:var(--codeink);border-radius:10px;padding:10px 12px;overflow:auto;font:13px/1.5 ui-monospace,Menlo,monospace}
  .cite{display:inline-block;min-width:20px;text-align:center;background:var(--brand2);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:0 5px;margin:0 2px;cursor:pointer;vertical-align:1px}
  .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .src{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;text-decoration:none;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src b{color:var(--brand2)}
  .src.hl{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(74,91,255,.2)}
  .composer{border-top:1px solid var(--line);padding:12px 16px}
  .suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:14px}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.q{background:#eef0ff;border-color:#dfe3f7}
  .row{display:flex;gap:8px;align-items:center}
  textarea{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:none;height:52px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:10px 16px}
  button.ghost{background:#fff;color:var(--brand)}
  button:disabled{opacity:.5;cursor:wait}
  .opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
  #steps{flex:1;overflow:auto;padding:14px 16px}
  .empty{color:var(--muted);font-size:15px;padding:20px}
  .step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .step .hd{display:flex;align-items:center;gap:10px}
  .step .n{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .step .t{font-weight:700}
  .step .ms{margin-left:auto;font-size:13px;font-weight:700;color:var(--ok);background:#e9f7ef;border-radius:6px;padding:1px 7px}
  .step .ms.llm{color:#9a4b00;background:#fff1e3}
  .step .body{font-size:14px;color:var(--ink);margin-top:6px}
  .step .sub{color:var(--muted)}
  .console{background:var(--code);color:var(--codeink);border-radius:8px;padding:8px 10px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;margin-top:6px}
  .res{display:grid;grid-template-columns:24px 1fr 90px;gap:6px 8px;align-items:center;margin-top:6px;font-size:13px}
  .res .bar{height:8px;border-radius:4px;background:#e6e9fb;overflow:hidden}.res .bar i{display:block;height:100%;background:var(--brand2)}
  .res .num{font-weight:700;color:var(--brand2)}
  .res .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 5px;background:#eef0ff;color:var(--brand);margin-left:4px}
  .zero{color:var(--ko);font-weight:700}
  details summary{cursor:pointer;color:var(--brand2);font-size:13px;margin-top:4px}
  details pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace;background:#f7f8ff;border-radius:8px;padding:8px;max-height:260px;overflow:auto}
  .total{font-size:14px;color:var(--muted);text-align:right;padding:4px 4px 0}
  .err{color:var(--ko);font-weight:700}
  .typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--brand2)}
  @keyframes blink{50%{opacity:0}}
  @media (max-width:1100px){main{grid-template-columns:1fr;height:auto}.col{min-height:60vh}}
</style>
</head>
<body>
<header>
  <h1>Démo 2 · Assistant RAG</h1>
  <span class="pill" id="pTarget">…</span>
  <span class="pill" id="pModels">…</span>
  <span class="pill" id="pDocs">…</span>
  <span class="spacer"></span>
  <span class="pill" id="pSession"></span>
</header>
<main>
  <section class="col">
    <h2>Conversation <span class="r"><button class="ghost" id="newChat" style="padding:4px 10px;font-size:13px">↺ Nouvelle conversation</button></span></h2>
    <div id="chat"></div>
    <div class="composer">
      <div class="suggest" id="suggest"></div>
      <div class="row">
        <textarea id="q" placeholder="Posez une question sur Valkey, Valkey Search ou AI Endpoints…"></textarea>
        <button id="send">Envoyer</button>
      </div>
      <div class="opts">
        <span>Sources :</span><span id="srcChips" class="row" style="gap:6px;flex-wrap:wrap"></span>
        <label><input type="checkbox" id="cmpFt"> comparer au plein texte</label>
        <label><input type="checkbox" id="noRag"> sans RAG (modèle seul)</label>
      </div>
    </div>
  </section>
  <section class="col">
    <h2>Sous le capot <span class="r" id="totalTop"></span></h2>
    <div id="steps"><div class="empty">Posez une question : chaque étape du RAG s'affiche ici, avec la commande envoyée à Valkey ou au modèle et son temps d'exécution.</div></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUGGEST = [
  "Comment créer un index vectoriel dans Valkey ?",
  "Comment faire une recherche hybride avec un filtre ?",
  "Et avec plusieurs valeurs de tag ?",
  "Quels modèles d'embedding propose AI Endpoints ?",
  "Combien coûte Mistral Small 3.2 sur AI Endpoints ?",
  "Comment me connecter en Python à un Valkey managé chez OVHcloud ?",
  "Quels modules Valkey sont activés sur Aiven for Valkey ?",
  "Comment Valkey garde-t-il les données en cas de redémarrage ?",
];
const LABEL = {ovhcloud_docs:"Docs OVHcloud", aiven_docs:"Docs Aiven", valkey_docs:"Docs Valkey", aiven_blog:"Blog Aiven", local:"Mes documents"};
const S = {session:null, sources:new Set(), busy:false, meta:null};

function newSession(){ const a = new Uint8Array(8); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2,"0")).join(""); }
function getSession(){ try { return sessionStorage.getItem("demo2-session"); } catch { return null; } }
function setSession(id){ S.session = id; try { sessionStorage.setItem("demo2-session", id); } catch {} $("#pSession").textContent = "historique : chat:" + id; }

/* ---------- rendu Markdown minimal et sûr ---------- */
function md(text, nSources){
  const blocks = String(text).split(/```/);
  return blocks.map((b,i) => {
    if(i % 2) return `<pre>${esc(b.replace(/^\w*\n/, ""))}</pre>`;
    let h = esc(b).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/\[(\d{1,2})\]/g, (m, n) => +n >= 1 && +n <= (nSources ?? 99) ? `<span class="cite" data-n="${n}">${n}</span>` : m);
    const lines = h.split("\n"); let out = "", list = null;
    for(const l of lines){
      const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if(ul || ol){ const t = ul ? "ul" : "ol"; if(list !== t){ if(list) out += `</${list}>`; out += `<${t}>`; list = t; } out += `<li>${(ul||ol)[1]}</li>`; continue; }
      if(list){ out += `</${list}>`; list = null; }
      if(l.trim()) out += `<p>${l.replace(/^#+\s*/, "")}</p>`;
    }
    return out + (list ? `</${list}>` : "");
  }).join("");
}

/* ---------- conversation ---------- */
function addMsg(role, html, opts={}){
  const el = document.createElement("div"); el.className = "msg " + role + (opts.norag ? " norag" : "");
  el.innerHTML = (opts.tagline ? `<div class="tagline">${opts.tagline}</div>` : "") + `<div class="content">${html}</div>`;
  $("#chat").appendChild(el); $("#chat").scrollTop = 1e9; return el;
}
function renderSources(el, srcs){
  if(!srcs?.length) return;
  const box = document.createElement("div"); box.className = "srcs";
  box.innerHTML = srcs.map(s => { const inner = `<b>[${s.n}]</b> ${esc(s.title)} · ${esc(LABEL[s.source]||s.source)}`;
    return /^https?:\/\//.test(s.url || "") ? `<a class="src" data-n="${s.n}" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${inner}</a>`
      : `<span class="src" data-n="${s.n}" title="${esc(s.title)}">${inner}</span>`; }).join("");
  el.appendChild(box);
  el.querySelectorAll(".cite").forEach(c => c.onclick = () => { const a = box.querySelector(`[data-n="${c.dataset.n}"]`);
    box.querySelectorAll(".src").forEach(x => x.classList.remove("hl")); if(a){ a.classList.add("hl"); a.scrollIntoView({block:"nearest"}); } });
}

/* ---------- panneau « Sous le capot » ---------- */
const STEP = {
  history:  ["Historique", "Valkey"],
  rewrite:  ["Reformulation de la question", "LLM"],
  embed:    ["Question → vecteur", "Embedding"],
  search:   ["Recherche vectorielle dans Valkey", "Valkey"],
  fulltext: ["Comparaison : recherche plein texte", "Valkey"],
  guard:    ["Garde-fou : aucun extrait pertinent", ""],
  prompt:   ["Construction du prompt", ""],
  generate: ["Génération de la réponse", "LLM"],
  save:     ["Sauvegarde dans l'historique", "Valkey"],
};
let stepNo = 0;
function stepCard(name, d){
  let [title, kind] = STEP[name] || [name, ""]; stepNo++;
  if(name === "rewrite" && d.skipped) kind = "règle";
  const ms = d.ms ?? d.total_ms;
  const el = document.createElement("div"); el.className = "step";
  let body = "";
  if(name === "history") body = `<div class="sub">${d.messages} message(s) repris comme contexte de conversation</div><div class="console">${esc(d.command)}</div>`;
  if(name === "rewrite") body = d.skipped
    ? `<div class="sub">« ${esc(d.original)} »</div><div>→ envoyée telle quelle</div><div class="sub">${esc(d.reason)}</div>`
    : `<div class="sub">« ${esc(d.original)} »</div><div>→ <b>${esc(d.standalone)}</b></div>` +
      (d.rejected ? `<div class="sub">proposition du modèle écartée (${esc(d.rejected)}) : « ${esc(d.proposed)} »</div>` : "") +
      `<div class="sub">${esc(d.model)}</div>`;
  if(name === "embed") body = `<div class="sub">${esc(d.model)} · ${d.dim} dimensions</div><div class="console">[${d.preview.join(", ")}, …]</div>`;
  if(name === "search") body = `<div class="console">${esc(d.command)}</div>` +
      `<div class="sub">${d.results.length} candidats → <b>${d.kept} extrait(s) donnés au modèle</b> · seuil ${d.threshold} · ≤ ${d.max_per_doc} par page${d.max_per_source ? ` · ≤ ${d.max_per_source} par source` : ""}</div>` +
      `<div class="res">` + d.results.map(r => { const off = !r.kept;
        return `<span class="num" style="${off ? "opacity:.35" : ""}">${r.n ? `[${r.n}]` : "–"}</span><span class="ti" style="${off ? "opacity:.45" : ""}" title="${esc(r.excerpt)}">${esc(r.title)}${r.section && r.section !== r.title ? " › " + esc(r.section.split(" › ").pop()) : ""}<span class="badge">${esc(LABEL[r.source]||r.source)}</span>${off ? `<span class="badge" style="background:#fdecea;color:#c4321b">${esc(r.status||"écarté")}</span>` : ""}</span>
       <span class="bar" title="similarité ${r.similarity}" style="${off ? "opacity:.35" : ""}"><i style="width:${Math.max(4, Math.round((r.similarity||0)*100))}%;${off ? "background:#c4321b" : ""}"></i></span>`; }).join("") + `</div>`;
  if(name === "guard") body = `<div>Meilleure similarité trouvée : <b>${d.best}</b>, sous le seuil <b>${d.threshold}</b>${d.filters.length ? ` avec le filtre ${d.filters.map(f => esc(LABEL[f]||f)).join(", ")}` : ""}.</div>
      <div class="sub">Réponse refusée sans appeler le modèle : il ne peut rien inventer à partir de sources non autorisées.</div>`;
  if(name === "fulltext") body = `<div class="sub">mots-clés : ${d.keywords.map(esc).join(", ")}</div><div class="console">${esc(d.command)}</div>` +
      (d.error ? `<div class="err">Recherche plein texte en erreur : ${esc(d.error)}</div>` : d.total ? `<div>${d.total} résultat(s) : ${d.results.map(r => esc(r.title)).join(" · ")}</div>` : `<div class="zero">0 résultat : les mots de la question n'apparaissent pas tels quels dans les documents (en anglais).</div>`);
  if(name === "prompt") body = `<div class="sub">${d.rag ? "consignes + extraits numérotés + question" : "question seule, sans extraits"} · ≈ ${d.approx_tokens} tokens</div>` +
      `<details><summary>voir le prompt envoyé au modèle</summary><pre>${esc(d.messages.map(m => `### ${m.role}\n${m.content}`).join("\n\n"))}</pre></details>`;
  if(name === "generate") body = `<div class="sub">${esc(d.model)}</div><div>premier token : <b>${d.first_token_ms} ms</b> · total : <b>${d.total_ms} ms</b> · ${d.tokens_per_s} tokens/s · ${d.prompt_tokens ?? "?"} → ${d.completion_tokens ?? "?"} tokens</div>`;
  if(name === "save") body = d.commands.map(c => `<div class="console">${esc(c)}</div>`).join("") + `<div class="sub">${d.length} messages dans le stream · expire après 1 h d'inactivité</div>`;
  el.innerHTML = `<div class="hd"><span class="n">${stepNo}</span><span class="t">${title}</span>${kind ? `<span class="badge">${kind}</span>` : ""}${ms !== undefined ? `<span class="ms ${kind === "LLM" ? "llm" : ""}">${ms} ms</span>` : ""}</div><div class="body">${body}</div>`;
  $("#steps").appendChild(el); $("#steps").scrollTop = 1e9;
}

/* ---------- envoi ---------- */
async function ask(question){
  if(S.busy || !question.trim()) return;
  S.busy = true; $("#send").disabled = true; $("#q").value = "";
  const noRag = $("#noRag").checked;
  addMsg("user", esc(question));
  const bot = addMsg("assistant", "", {norag:noRag, tagline: noRag ? "Sans RAG : le modèle répond de mémoire" : "Avec RAG : réponse appuyée sur la base de connaissance"});
  const content = bot.querySelector(".content"); content.classList.add("typing");
  $("#steps").innerHTML = ""; stepNo = 0; $("#totalTop").textContent = "";
  let text = "", finished = false;
  try {
    const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session:S.session, question, sources:[...S.sources], use_rag:!noRag, compare_fulltext:$("#cmpFt").checked})});
    if(!r.ok) throw new Error(await r.text());
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for(;;){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i; while((i = buf.indexOf("\n\n")) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if(!line.startsWith("data:")) continue;
        const e = JSON.parse(line.slice(5));
        if(e.type === "step") stepCard(e.name, e.data);
        else if(e.type === "token"){ text += e.text; content.innerHTML = md(text); $("#chat").scrollTop = 1e9; }
        else if(e.type === "done"){ finished = true; content.classList.remove("typing"); content.innerHTML = md(e.answer, e.sources.length || 0); renderSources(bot, e.sources);
          $("#totalTop").textContent = `total ${(e.total_ms/1000).toFixed(1)} s`; }
        else if(e.type === "error"){ throw new Error(e.message); }
      }
    }
    if(!finished) throw new Error("flux interrompu avant la fin de la réponse");
  } catch(err){ content.classList.remove("typing"); content.innerHTML += `<p class="err">Erreur : ${esc(err.message)}</p>`; }
  S.busy = false; $("#send").disabled = false; $("#q").focus();
}

async function loadHistory(){
  const r = await fetch(`/api/history/${S.session}`); if(!r.ok) return;
  const h = await r.json();
  h.messages.forEach(m => { if(m.role === "user") addMsg("user", esc(m.content));
    else { const el = addMsg("assistant", md(m.content, m.sources.length)); renderSources(el, m.sources); } });
}

/* ---------- initialisation ---------- */
$("#send").onclick = () => ask($("#q").value);
$("#q").onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask($("#q").value); } };
$("#newChat").onclick = async () => { await fetch(`/api/history/${S.session}`, {method:"DELETE"}); setSession(newSession());
  $("#chat").innerHTML = ""; $("#steps").innerHTML = '<div class="empty">Nouvelle conversation : l\'historique précédent a été supprimé de Valkey (DEL).</div>'; };
$("#suggest").innerHTML = SUGGEST.map(q => `<span class="chip q">${esc(q)}</span>`).join("");
document.querySelectorAll("#suggest .chip").forEach(c => c.onclick = () => ask(c.textContent));

(async () => {
  setSession(getSession() || newSession());
  const m = await (await fetch("/api/meta")).json(); S.meta = m;
  $("#pTarget").textContent = `Cible : ${m.target} · ${m.valkey}`;
  $("#pModels").textContent = `${m.embed_model} + ${m.chat_model} @ ${m.llm_host}`;
  $("#pDocs").textContent = m.ready ? `${m.num_docs} chunks · ${m.index}` : "index absent : make load";
  if(!m.ready) $("#steps").innerHTML = `<div class="empty err">L'index ${esc(m.index)} n'existe pas dans ${esc(m.valkey)}.<br>Lancer <code>make load</code> puis <code>make check</code>, et recharger la page. Seul le mode « sans RAG » fonctionne en attendant.</div>`;
  if(!m.ready || m.embed_mismatch) $("#pDocs").classList.add("warn");
  if(m.embed_mismatch) $("#pDocs").textContent += " · index vectorisé avec un autre modèle !";
  const chips = $("#srcChips");
  m.sources.filter(s => s.count).forEach(s => { const c = document.createElement("span"); c.className = "chip"; c.textContent = `${s.label} (${s.count})`;
    c.onclick = () => { S.sources.has(s.tag) ? S.sources.delete(s.tag) : S.sources.add(s.tag); c.classList.toggle("on"); }; chips.appendChild(c); });
  if(!m.text_search){ $("#cmpFt").disabled = true; $("#cmpFt").parentElement.title = "plein texte indisponible sur ce serveur"; }
  await loadHistory();
})().catch(e => addMsg("assistant", `<p class="err">Erreur au chargement : ${esc(e.message)}</p>`));
</script>
</body>
</html>
